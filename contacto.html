<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto - Mi Prueba GitHub</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">🏠 Inicio</a></li>
            <li><a href="about.html">📖 About</a></li>
            <li><a href="contacto.html" class="active">📧 Contacto</a></li>
        </ul>
    </nav>

    <div class="container">
        <header>
            <h1>📧 Contacto</h1>
            <p class="subtitle">Página de contacto de prueba</p>
        </header>

        <main>
            <div class="card">
                <h2>✉️ Formulario de prueba</h2>
                <form id="formContacto" class="contact-form">
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" placeholder="Tu nombre" required />
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" placeholder="tu@email.com" required />
                    </div>
                    <div class="form-group">
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" rows="4" placeholder="Escribe tu mensaje..."></textarea>
                    </div>
                    <button type="submit" class="btn">Enviar (simulado)</button>
                </form>
                <div id="formRespuesta" class="form-respuesta" style="display:none;"></div>
            </div>

            <div class="card">
                <h2>📊 Estadísticas de prueba</h2>
                <div class="stats">
                    <div class="stat">
                        <span class="stat-number" id="visitas">0</span>
                        <span class="stat-label">Visitas (simuladas)</span>
                    </div>
                    <div class="stat">
                        <span class="stat-number" id="paginasVistas">0</span>
                        <span class="stat-label">Páginas vistas</span>
                    </div>
                </div>
            </div>

            <a href="index.html" class="btn">← Volver al inicio</a>
        </main>

        <footer>
            <p>Desplegado en GitHub Pages &bull; <span id="year"></span></p>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
              </html>
